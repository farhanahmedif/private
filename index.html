<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>টিউশন ম্যানেজার</title>
<style>
:root{--bg:#f2f4f1;--sf:#fff;--tx:#18211d;--mu:#5f6d67;--ac:#1f4d3f;--on:#fff;--hl:#e3b52c;--bd:#d6ddd8;--ok:#1b7a43;--no:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#101815;--sf:#18231f;--tx:#e6ede9;--mu:#93a39b;--ac:#6fd1ab;--on:#0b1713;--hl:#e8c04a;--bd:#2a3a34;--ok:#5fd88c;--no:#ff8a80}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",Kalpurush,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{background:var(--ac);color:var(--on);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
header h1{margin:0;font-size:20px;font-weight:700}
main{max-width:720px;margin:0 auto;padding:12px}
h2{font-size:17px;margin:0 0 10px}
section.blk{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.big{padding:6px 2px 14px}
.big b{display:block;font-size:44px;line-height:1.1;color:var(--no);border-bottom:4px solid var(--hl);width:max-content;max-width:100%}
.big span{color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px}
.stat b{display:block;font-size:18px}
.stat span{font-size:13px;color:var(--mu)}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.line:first-of-type{border-top:0}
.line small{display:block;color:var(--mu);font-size:13px}
.row{border-top:1px solid var(--bd);padding-bottom:10px}
.row:first-of-type{border-top:0}
.row .line{border-top:0}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mu{color:var(--mu)}
.no{color:var(--no)}.ok{color:var(--ok)}
label{display:block;font-size:14px;color:var(--mu);margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input:not([type=checkbox]){display:block;width:100%;margin-top:4px;padding:10px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
.chk{display:flex;gap:8px;align-items:center}
.btn{font:inherit;font-weight:600;border:1px solid var(--ac);background:var(--ac);color:var(--on);padding:10px 16px;border-radius:8px;cursor:pointer;display:inline-block}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ac)}
.btn.danger{background:transparent;color:var(--no);border-color:var(--no)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.nob{background:var(--no);border-color:var(--no);color:#fff}
.acts input{width:120px;margin:0}
.rep{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;font:inherit;margin:12px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;font:inherit;font-size:13px;padding:12px 2px;border:0;background:none;color:var(--mu);cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--ac);font-weight:700;border-top-color:var(--hl)}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--hl);outline-offset:2px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:90%}
</style>
</head>
<body>
<header><h1>টিউশন ম্যানেজার</h1></header>
<main id="view"></main>
<nav>
<button data-tab="dash">হোম</button>
<button data-tab="stu">স্টুডেন্ট</button>
<button data-tab="att">হাজিরা</button>
<button data-tab="pay">বেতন</button>
<button data-tab="bak">ব্যাকআপ</button>
</nav>
<div id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
